<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Appeals | EPMS</title><link rel="stylesheet" href="css/style.css"></head><body><main class="container"><div id="content"></div></main><script type="module">import{apiGet,apiPost,apiPatch,downloadFile,escapeHTML,status,requireRole,q,getUser}from'./js/common.js';const u=await requireRole(['employee','manager','senior_authority','sm','board_member','performance_officer','admin']);if(u){document.querySelector('[data-logout]').onclick=()=>{localStorage.clear();location.href='login.html'};const id=q('id'),queue=q('queue'),content=document.querySelector('#content');async function list(){let rows=[];if(u.role==='employee')rows=(await apiGet('/api/performance-appeals/my')).appeals||[];else if(u.role==='manager')rows=(await apiGet('/api/manager/appeals')).appeals||[];else if(['senior_authority','sm'].includes(u.role))rows=(await apiGet('/api/senior/appeals')).appeals||[];else if(u.role==='board_member')rows=(await apiGet('/api/board/appeals')).appeals||[];else{const r=await apiGet('/api/reports/appeals');rows=r.report||[]}content.innerHTML=`<div class="page-title"><div><h2>Appeals</h2><p class="muted">Transparent multi-level appeal history.</p></div>${u.role==='employee'?'<a class="button" href="#new">+ New appeal</a>':''}</div>${u.role==='employee'?'<section id="new" class="card section"><h3>Submit an appeal</h3><form id="appeal-form"><label>Work</label><select name="work_id" required><option value="">Loading...</option></select><label>Appeal type</label><select name="appeal_type"><option value="work_rejection">Work rejection</option><option value="low_credit">Low credit</option><option value="performance_score">Performance score</option><option value="incorrect_attribution">Incorrect attribution</option><option value="other">Other</option></select><label>Reason</label><textarea name="reason" required></textarea><label>Requested credit (optional)</label><input name="requested_credit" type="number" min="1" max="5"><button>Submit appeal</button><p id="am" class="message"></p></form></section>':''}<div class="table-wrap"><table><thead><tr><th>Reference</th><th>Employee</th><th>Work</th><th>Status</th><th>Level</th><th></th></tr></thead><tbody>${rows.length?rows.map(a=>`<tr><td>${escapeHTML(a.appeal_reference||a.id)}</td><td>${escapeHTML(a.employee_name||a.employee_id||'')}</td><td>${escapeHTML(a.work_title||a.work_id||'')}</td><td>${status(a.status)}</td><td>${escapeHTML(a.current_level||'')}</td><td>${a.id?`<a class="button" href="appeal-detail.html?id=${a.id}">Open</a>`:''}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">No appeals.</td></tr>'}</tbody></table></div>`;if(u.role==='employee'){const sel=document.querySelector('#appeal-form [name=work_id]'),typeSel=document.querySelector('#appeal-form [name=appeal_type]');const mine=((await apiGet('/api/work/my')).work||[]).filter(w=>w.status!=='draft');sel.innerHTML=mine.length?mine.map(w=>`<option value="${w.id}" data-status="${w.status}">${escapeHTML(w.work_reference||w.id)} - ${escapeHTML(w.title)} (${escapeHTML(w.status)})</option>`).join(''):'<option value="">You have no submitted work to appeal</option>';const pre=q('work');if(pre)sel.value=pre;const guess=()=>{const st=sel.selectedOptions[0]?.dataset.status;if(st==='rejected')typeSel.value='work_rejection';else if(st==='approved')typeSel.value='low_credit'};guess();sel.onchange=guess;if(location.hash==='#new')document.querySelector('#new')?.scrollIntoView();document.querySelector('#appeal-form')?.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;try{const r=await apiPost('/api/performance-appeals',{work_id:Number(f.work_id.value),appeal_type:f.appeal_type.value,reason:f.reason.value,requested_credit:f.requested_credit.value||null});location.href=`appeal-detail.html?id=${r.appeal_id||r.id}`}catch(x){document.querySelector('#am').textContent=x.message}})}}
async function detail(){const r=await apiGet('/api/performance-appeals/'+id),a=r.appeal;content.innerHTML=`<div class="page-title"><div><h2>${escapeHTML(a.appeal_reference)}</h2><p class="muted">${escapeHTML(a.appeal_type)}</p></div></div><section class="card"><dl class="profile-grid"><dt>Employee</dt><dd>${escapeHTML(a.employee_name)}</dd><dt>Work</dt><dd><a href="work.html?id=${a.work_id}">${escapeHTML(a.work_title||'')}</a></dd><dt>Status</dt><dd>${status(a.status)}</dd><dt>Current level</dt><dd>${escapeHTML(a.current_level)}</dd><dt>Reason</dt><dd>${escapeHTML(a.reason)}</dd><dt>Requested credit</dt><dd>${escapeHTML(a.requested_credit||'-')}</dd></dl></section><section class="section card"><h3>Timeline</h3><div class="timeline">${r.history?.map(x=>`<div class="timeline-item"><strong>${escapeHTML(x.action)}</strong> — ${escapeHTML(x.decision||'')}<br>${escapeHTML(x.comments||'')}<br><span class="small muted">${escapeHTML(x.created_at)}</span></div>`).join('')||'<div class="muted">No history.</div>'}</div></section><section class="section card"><h3>Evidence</h3>${u.role==='employee'?'<form id="appeal-file" class="section"><input name="file" type="file" accept=".pdf,.ppt,.pptx,.doc,.docx,.xls,.xlsx,.csv,.zip,.png,.jpg,.jpeg" required><button>Upload evidence</button><p id="fm" class="message"></p></form>':''}${r.files?.length?r.files.map(f=>`<div class="file-item"><span>${escapeHTML(f.original_filename)}</span><button class="secondary" data-f="${f.id}" data-n="${escapeHTML(f.original_filename)}">Download</button></div>`).join(''):'<div class="empty">No appeal evidence.</div>'}</section>${['manager','senior_authority','sm','board_member'].includes(u.role)?`<section class="section card"><h3>Decision</h3><form id="decision"><label>Decision</label><select name="decision"><option value="uphold">Uphold</option><option value="modify">Modify</option><option value="escalate">Escalate</option></select><label>Comments</label><textarea name="comments" required></textarea><label>New credit rating, if modifying</label><input name="new_credit_rating" type="number" min="1" max="5"><button>Save decision</button><p id="dm" class="message"></p></form></section>`:''}`;document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>downloadFile(`/api/performance-appeals/${id}/files/${b.dataset.f}/download`,b.dataset.n));if(document.querySelector('#appeal-file'))document.querySelector('#appeal-file').onsubmit=async e=>{e.preventDefault();const f=e.target.file.files[0],m=document.querySelector('#fm');try{const data=await new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=reject;rd.readAsDataURL(f)});await apiPost(`/api/performance-appeals/${id}/files`,{file:{original_filename:f.name,mime_type:f.type,data}});m.textContent='Evidence uploaded.';m.className='message success';setTimeout(()=>location.reload(),500)}catch(x){m.textContent=x.message;m.className='message error'}};if(document.querySelector('#decision'))document.querySelector('#decision').onsubmit=async e=>{e.preventDefault();const f=e.target;let endpoint=u.role==='manager'?`/api/manager/appeals/${id}/resolve`:['senior_authority','sm'].includes(u.role)?`/api/senior/appeals/${id}/resolve`:`/api/board/appeals/${id}/resolve`;try{await apiPatch(endpoint,{decision:f.decision.value,comments:f.comments.value,new_credit_rating:f.new_credit_rating.value});location.reload()}catch(x){document.querySelector('#dm').textContent=x.message}}}
if(id)detail();else list()}
</script></body></html>
