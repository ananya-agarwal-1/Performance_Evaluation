<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Employee | EPMS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-roles="employee">
<main class="container"><h2 id="greeting">Welcome</h2><p class="muted">Employee Dashboard</p>
  <h3 style="margin-top:22px">Your work at a glance</h3><p class="muted" style="margin:0 0 10px">Totals update as managers review what you submit.</p>
  <div id="cards" class="stat-grid"></div>
  <section class="card chart-card"><div id="perf-chart"></div></section>

  <h3 style="margin-top:26px">Recent activity</h3><p class="muted" style="margin:0 0 10px">Your latest work records and where they stand.</p>
  <div class="table-wrap"><table><thead><tr><th>Work</th><th>Employee</th><th>Status</th><th>Credits</th></tr></thead><tbody id="recent"><tr><td colspan="4" class="empty">Loading…</td></tr></tbody></table></div>
</main>
<script type="module" src="js/dashboard.js"></script>
</body>
</html>
