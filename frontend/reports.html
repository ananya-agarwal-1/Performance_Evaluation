<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports | EPMS</title><link rel="stylesheet" href="css/style.css"></head><body><main class="container"><div class="page-title"><div><h2>Reports</h2><p class="muted">Live reports generated from the database.</p></div></div><div class="tabs"><button data-type="employees">Employees</button><button data-type="performance">Performance</button><button data-type="work">Work</button><button data-type="credits">Credits</button><button data-type="appeals">Appeals</button></div><section class="section card"><div class="actions" style="margin:0 0 16px"><button id="xlsx">Download Excel</button><button id="csv" class="secondary">Download CSV</button></div><div class="table-wrap"><table><thead id="head"></thead><tbody id="body"></tbody></table></div></section></main><script type="module">import{apiGet,downloadFile,escapeHTML,requireRole}from'./js/common.js';const u=await requireRole(['performance_officer','senior_authority','sm','board_member','admin','employee']);if(u){document.querySelector('[data-logout]').onclick=()=>{localStorage.clear();location.href='login.html'};let type=new URLSearchParams(location.search).get('type')||'employees';const privileged=!['employee'].includes(u.role);if(!privileged&&type!=='credits')type='credits';async function load(){document.querySelectorAll('[data-type]').forEach(b=>{b.classList.toggle('active',b.dataset.type===type);if(!privileged&&b.dataset.type!=='credits')b.classList.add('hidden')});let rows=[];if(type==='employees')rows=(await apiGet('/api/reports/employees')).rows||[];else if(type==='performance')rows=(await apiGet('/api/reports/performance')).rows||[];else if(type==='credits')rows=u.role==='employee'?(await apiGet('/api/credits/history')).transactions||[]:(await apiGet('/api/reports/credits')).rows||[];else if(type==='work')rows=privileged?((await apiGet('/api/performance-officer/work')).work||[]):((await apiGet('/api/work/my')).work||[]);else if(type==='appeals'){rows=(await apiGet('/api/reports/appeals')).report||[]}const keys=rows.length?Object.keys(rows[0]):[];document.querySelector('#head').innerHTML='<tr>'+keys.map(k=>`<th>${escapeHTML(k.replaceAll('_',' '))}</th>`).join('')+'</tr>';document.querySelector('#body').innerHTML=rows.length?rows.map(r=>'<tr>'+keys.map(k=>`<td>${escapeHTML(r[k])}</td>`).join('')+'</tr>').join(''):'<tr><td class="empty">No data.</td></tr>'}document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{type=b.dataset.type;history.replaceState({},'',`reports.html?type=${type}`);load()});document.querySelector('#xlsx').onclick=()=>downloadFile(`/api/reports/export?type=${type}&format=xlsx`,`epms_${type}.xlsx`);document.querySelector('#csv').onclick=()=>downloadFile(`/api/reports/export?type=${type}&format=csv`,`epms_${type}.csv`);load()}</script></body></html>
