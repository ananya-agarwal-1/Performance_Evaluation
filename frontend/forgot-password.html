<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot password | EPMS</title>
<link rel="stylesheet" href="css/login.css">
</head>
<body class="login-bg">
<div class="login-box">
  <h1>Forgot <span>Password</span></h1>
  <p class="sub">In this demo the reset code is shown on screen.</p>
  <form id="f">
    <input id="email" name="email" type="email" placeholder="Email" required>
    <button type="submit">Get reset code</button>
    <p id="m" class="message" role="status"></p>
    <div id="code" class="notice hidden"></div>
  </form>
  <p class="links"><a href="login.html">Back to login</a></p>
</div>
<script type="module">import{apiPost}from'./js/api.js';const f=document.querySelector('#f'),m=document.querySelector('#m'),c=document.querySelector('#code');f.onsubmit=async e=>{e.preventDefault();try{const r=await apiPost('/api/auth/forgot-password',{email:f.email.value});m.textContent=r.message;if(r.demo_token){c.classList.remove('hidden');c.innerHTML=`Demo reset code: <strong>${r.demo_token}</strong><br><a href="reset-password.html">Continue to reset password</a>`}}catch(x){m.className='message error';m.textContent=x.message}};</script>
</body>
</html>
