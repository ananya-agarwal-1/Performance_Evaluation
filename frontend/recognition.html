<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recognition | EPMS</title><link rel="stylesheet" href="css/style.css"></head><body><main class="container"><div class="page-title"><div><h2>Recognition</h2><p class="muted">Acknowledge good work, or see what has been said about yours.</p></div></div><div id="employee-view" class="hidden"><div id="recognitions"></div></div><div id="manager-view" class="hidden"><form id="f"><div class="form-grid"><div><label>Employee ID</label><input name="employee_id" required></div><div><label>Category</label><select name="category"><option>Outstanding Work</option><option>Innovation</option><option>Team Contribution</option><option>Leadership</option><option>Initiative</option><option>Quality</option></select></div><div><label>Title</label><input name="title" required></div><div class="full"><label>Message</label><textarea name="message"></textarea></div></div><button>Create recognition</button><p id="m" class="message"></p></form></div></main><script type="module">import{apiGet,apiPost,escapeHTML,getUser,requireRole}from'./js/common.js';const u=getUser(),user=await requireRole(['employee','manager']);if(user){document.querySelector('[data-logout]').onclick=()=>{localStorage.clear();location.href='login.html'};if(user.role==='employee'){document.querySelector('#employee-view').classList.remove('hidden');const r=await apiGet('/api/recognitions/my');document.querySelector('#recognitions').innerHTML=r.recognitions?.length?r.recognitions.map(x=>`<div class="note-card"><h3>${escapeHTML(x.title)}</h3><p>${escapeHTML(x.message||'')}</p><span class="status approved">${escapeHTML(x.category)}</span> <span class="small muted">${escapeHTML(x.created_at)}</span></div>`).join(''):'<div class="empty">No recognition yet.</div>'}else{document.querySelector('#manager-view').classList.remove('hidden');document.querySelector('#f').onsubmit=async e=>{e.preventDefault();const f=e.target;try{await apiPost('/api/manager/recognitions',{employee_id:f.employee_id.value,category:f.category.value,title:f.title.value,message:f.message.value});document.querySelector('#m').textContent='Recognition created.';document.querySelector('#m').className='message success';f.reset()}catch(x){document.querySelector('#m').textContent=x.message}}}}</script></body></html>
