<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Details | EPMS</title><link rel="stylesheet" href="css/style.css"></head><body><main class="container"><div id="content"></div></main><script type="module">import{apiGet,escapeHTML,status,money,requireRole,q}from'./js/common.js';const u=await requireRole(['employee','manager','senior_authority','sm','performance_officer','board_member','admin']);if(u){document.querySelector('[data-logout]').onclick=()=>{localStorage.clear();location.href='login.html'};const id=q('id')||u.employee_id;const r=await apiGet('/api/employees/'+encodeURIComponent(id));const e=r.employee;document.querySelector('#content').innerHTML=`<div class="page-title"><div><h2>${escapeHTML(e.name||e.employee_id)}</h2><p class="muted">${escapeHTML(e.employee_id)} · ${escapeHTML(e.latest_job_role||'')}</p></div></div><section class="card"><h3>Profile</h3><dl class="profile-grid">${Object.entries(e).filter(([k])=>!['password'].includes(k)).map(([k,v])=>`<dt>${escapeHTML(k.replaceAll('_',' '))}</dt><dd>${escapeHTML(v)}</dd>`).join('')}</dl></section><section class="section card"><h3>Work history</h3><div class="table-wrap"><table><thead><tr><th>Reference</th><th>Title</th><th>Status</th><th>Credits</th><th></th></tr></thead><tbody>${r.work?.length?r.work.map(w=>`<tr><td>${escapeHTML(w.work_reference)}</td><td>${escapeHTML(w.title)}</td><td>${status(w.status)}</td><td>${money(w.credits_earned)}</td><td><a class="button" href="work.html?id=${w.id}">Open</a></td></tr>`).join(''):'<tr><td colspan="5" class="empty">No work.</td></tr>'}</tbody></table></div></section><section class="section card"><h3>Performance trend</h3><div class="table-wrap"><table><thead><tr><th>Month</th><th>Score</th><th>Manager rating</th><th>Tasks</th><th>Attendance</th></tr></thead><tbody>${r.performance?.map(p=>`<tr><td>${escapeHTML(p.month)}</td><td>${p.performance_score}</td><td>${p.manager_rating}</td><td>${p.tasks_completed}</td><td>${p.attendance_rate}%</td></tr>`).join('')||''}</tbody></table></div></section><section class="section card"><h3>Recognition</h3>${r.recognitions?.length?r.recognitions.map(x=>`<div class="notice"><strong>${escapeHTML(x.title)}</strong> <span class="status approved">${escapeHTML(x.category)}</span><br>${escapeHTML(x.message||'')}<br><span class="small muted">${escapeHTML(x.created_at)}</span></div>`).join(''):'<div class="empty">No recognition yet.</div>'}</section>`}</script></body></html>
