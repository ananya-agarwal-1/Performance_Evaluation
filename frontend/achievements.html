<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Achievements | EPMS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container">
  <div class="page-title"><div><h2>Achievements</h2><p class="muted">Your recognition, milestones and the work you have contributed.</p></div></div>
  <div id="content"><p class="muted">Loading...</p></div>
</main>
<script type="module">
import{apiGet,escapeHTML,requireRole,shell,money}from'./js/common.js';

const u=await requireRole(['employee']);
const content=document.querySelector('#content');
const val=v=>escapeHTML(v??'-');
const day=v=>escapeHTML(String(v||'').slice(0,10));

if(u){
  shell();
  const [summary,recs,work,timeline]=await Promise.all([
    apiGet('/api/portal/summary'),
    apiGet('/api/recognitions/my'),
    apiGet('/api/work/my'),
    apiGet('/api/contributions/my')
  ]);
  const stats=summary.data?.stats||{};
  const recognitions=recs.recognitions||[];
  const items=(work.work||work.items||[]);
  const approved=items.filter(w=>w.status==='approved');
  const credits=Number(stats.credits||0);

  // work areas: what the employee has worked on, grouped by type
  const areas={};
  approved.forEach(w=>{const t=w.work_type||'Other';areas[t]=areas[t]||{count:0,hours:0};areas[t].count++;areas[t].hours+=Number(w.hours_spent||0)});
  const areaRows=Object.entries(areas).sort((a,b)=>b[1].count-a[1].count);

  const milestones=[
    ['First approved work',approved.length>=1],
    ['5 approved works',approved.length>=5],
    ['10 credits earned',credits>=10],
    ['25 credits earned',credits>=25],
    ['First recognition from a manager',recognitions.length>=1],
    ['3 recognitions',recognitions.length>=3]
  ];

  content.innerHTML=`
    <div class="stat-grid">
      <div class="stat-card"><h3>Recognitions</h3><div class="stat-value">${recognitions.length}</div></div>
      <div class="stat-card"><h3>Approved work</h3><div class="stat-value">${approved.length}</div></div>
      <div class="stat-card"><h3>Credits earned</h3><div class="stat-value">${money(credits)}</div></div>
      <div class="stat-card"><h3>Milestones reached</h3><div class="stat-value">${milestones.filter(m=>m[1]).length} / ${milestones.length}</div></div>
    </div>

    <h3>Recognition and appreciation</h3>
    ${recognitions.length?recognitions.map(r=>`<div class="note-card"><h3>${val(r.title)}</h3><p>${val(r.message)}</p><span class="status approved">${val(r.category)}</span> <span class="small muted">${day(r.created_at)}</span></div>`).join(''):'<div class="card empty">No recognition yet. It appears here when a manager recognises your work.</div>'}

    <h3 style="margin-top:24px">Milestones</h3>
    <div class="table-wrap"><table><thead><tr><th>Milestone</th><th>Status</th></tr></thead><tbody>
      ${milestones.map(m=>`<tr><td>${m[0]}</td><td>${m[1]?'<span class="badge-earned">Earned</span>':'<span class="badge-open">Not yet</span>'}</td></tr>`).join('')}
    </tbody></table></div>

    <h3 style="margin-top:24px">Work areas</h3>
    <p class="hint" style="margin:0 0 8px">Built from your approved work.</p>
    <div class="table-wrap"><table><thead><tr><th>Type of work</th><th>Approved works</th><th>Hours</th></tr></thead><tbody>
      ${areaRows.length?areaRows.map(([t,a])=>`<tr><td>${escapeHTML(t)}</td><td>${a.count}</td><td>${a.hours}</td></tr>`).join(''):'<tr><td colspan="3" class="empty">Approved work will show here.</td></tr>'}
    </tbody></table></div>

    <h3 style="margin-top:24px">Contribution history</h3>
    <div class="table-wrap"><table><thead><tr><th>Date</th><th>What happened</th><th>Details</th></tr></thead><tbody>
      ${(timeline.timeline||[]).length?timeline.timeline.slice(0,12).map(t=>`<tr><td>${day(t.event_at)}</td><td>${val(t.event_type)}</td><td>${val(t.description)}</td></tr>`).join(''):'<tr><td colspan="3" class="empty">Nothing recorded yet.</td></tr>'}
    </tbody></table></div>`;
}
</script>
</body>
</html>
