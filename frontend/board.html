<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Appeal Board | EPMS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-roles="board_member">
<main class="container"><h2 id="greeting">Welcome</h2><p class="muted">Appeal Board Dashboard</p>
  <h3 style="margin-top:22px">Cases awaiting a board decision</h3><p class="muted" style="margin:0 0 10px">Open a case to read the timeline and record your decision.</p>
  <div id="cards" class="stat-grid"></div>
  <div class="table-wrap" style="margin-top:28px"><table><thead><tr><th>Reference</th><th>Employee</th><th>Work</th><th>Status</th><th></th></tr></thead><tbody id="appeals"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody></table></div>
</main>
<script type="module">
import{apiGet,escapeHTML,status,requireRole,shell,renderStats}from'./js/common.js';
const u=await requireRole(['board_member']);
if(u){
  shell();
  const r=await apiGet('/api/board/appeals');
  renderStats(document.querySelector('#cards'),[
    {label:'Board queue',value:r.appeals?.length||0,note:'Cases waiting for the board.',href:'appeal-detail.html?queue=board'}
  ]);
  document.querySelector('#appeals').innerHTML=r.appeals?.length
    ?r.appeals.map(a=>`<tr><td>${escapeHTML(a.appeal_reference)}</td><td>${escapeHTML(a.employee_name)}</td><td>${escapeHTML(a.work_title||'')}</td><td>${status(a.status)}</td><td><a class="button" href="appeal-detail.html?id=${a.id}">Open</a></td></tr>`).join('')
    :'<tr><td colspan="5" class="empty">No board cases.</td></tr>';
}
</script>
</body>
</html>
