<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team | EPMS</title><link rel="stylesheet" href="css/style.css"></head><body data-roles="manager"><main class="container"><div class="page-title"><div><h2>My team</h2><p class="muted">Search and open the employees assigned to you.</p></div></div><form id="search"><div class="form-grid"><div><label>Search</label><input name="q" placeholder="Name, ID or email"></div><div><label>Department</label><input name="department"></div></div><div class="actions"><button type="submit">Search</button></div></form><section class="section"><div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Designation</th><th>Department</th><th>Performance</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script type="module">import{apiGet,escapeHTML,requireRole,shell}from'./js/common.js';await requireRole(['manager']);shell();const load=async()=>{const f=new FormData(document.querySelector('#search')),p=new URLSearchParams({search:f.get('q')||'',department:f.get('department')||'',limit:'100'});const r=await apiGet('/api/manager/employees?'+p);document.querySelector('#rows').innerHTML=r.employees?.length?r.employees.map(e=>`<tr><td>${escapeHTML(e.employee_id)}</td><td>${escapeHTML(e.name)}</td><td>${escapeHTML(e.designation||'')}</td><td>${escapeHTML(e.department||'')}</td><td>${e.performance_score??'-'}</td><td><a class="button" href="employee-detail.html?id=${encodeURIComponent(e.employee_id)}">Open</a></td></tr>`).join(''):'<tr><td colspan="6" class="empty">No employees found.</td></tr>'};document.querySelector('#search').onsubmit=e=>{e.preventDefault();load()};load();</script></body></html>
