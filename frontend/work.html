<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work | EPMS</title><link rel="stylesheet" href="css/style.css"></head><body><main class="container"><div class="page-title"><div><h2 id="title">Work</h2><p class="muted">Actual work, evidence, review and credit history.</p></div><a id="add" class="button" href="work.html?new=1">+ Add work</a></div><div id="content"></div></main><script type="module">
import{apiGet,apiPost,apiPatch,downloadFile,escapeHTML,status,money,requireRole,shell,q,getUser}from'./js/common.js';
const u=getUser();const role=u.role==='sm'?'senior_authority':u.role;const user=await requireRole([role]);if(user){shell('work');document.querySelector('[data-logout]').onclick=()=>{localStorage.clear();location.href='login.html'};const id=q('id'),mode=q('mode'),newMode=q('new');document.querySelector('#add').style.display=role==='employee'||role==='manager'?'inline-flex':'none';
const content=document.querySelector('#content');
async function list(){document.querySelector('#title').textContent=role==='manager'?'Team work':'My work';document.querySelector('#add').href=role==='manager'?'work.html?new=assigned':'work.html?new=1';let rows=[];if(role==='employee'){const r=await apiGet('/api/work/my');rows=r.work||[]}else if(role==='manager'){const r=await apiGet('/api/manager/work/pending');rows=r.work||[]}else{const r=await apiGet('/api/performance-officer/work');rows=r.work||[]}const st=q('status');if(st)rows=rows.filter(x=>x.status===st);const ty=q('type');if(ty)rows=rows.filter(x=>String(x.work_type||'').toLowerCase()===ty);if(mode==='review')rows=rows.filter(x=>['submitted','under_review'].includes(x.status));if(mode==='overdue')rows=rows.filter(x=>x.review_due_at&&new Date(x.review_due_at)<new Date());content.innerHTML=`<div class="table-wrap"><table><thead><tr><th>Reference</th><th>Work</th><th>Employee</th><th>Type</th><th>Status</th><th>Credits</th><th></th></tr></thead><tbody>${rows.length?rows.map(w=>`<tr><td>${escapeHTML(w.work_reference||w.id)}</td><td>${escapeHTML(w.title)}</td><td>${escapeHTML(w.employee_name||w.employee_id)}</td><td>${escapeHTML(w.work_type||'')}</td><td>${status(w.status)}</td><td>${money(w.credits_earned)}</td><td><a class="button" href="work.html?id=${w.id}">Open</a>${role==='employee'&&['approved','rejected'].includes(w.status)?` <a class="button secondary" href="appeal-detail.html?work=${w.id}#new">Appeal</a>`:''}${w.status==='appealed'?' <span class="small muted">Appeal in progress</span>':''}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">No work records.</td></tr>'}</tbody></table></div>`}
async function create(){document.querySelector('#title').textContent=role==='manager'?'Assign work':'Add my work';document.querySelector('#add').style.display='none';content.innerHTML=`<form id="work-form"><div class="form-grid">${role==='manager'?'<div><label>Employee ID</label><input name="employee_id" required></div>':''}<div><label>Work type</label><select name="work_type"><option>Project</option><option>Research</option><option>Development</option><option>Documentation</option><option>Presentation</option><option>Testing</option><option>Bug Fix</option><option>Client Work</option><option>Team Contribution</option><option>Training</option><option>Other</option></select></div><div><label>Title</label><input name="title" required></div><div><label>Work date</label><input name="work_date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div><label>${role==='manager'?'Estimated':'Hours'} spent</label><input name="hours_spent" type="number" min="0" max="24" step="0.25"></div><div class="full"><label>Description</label><textarea name="description" required></textarea></div>${role==='manager'?'<div><label>Priority</label><select name="priority"><option>low</option><option selected>medium</option><option>high</option><option>critical</option></select></div>':''}<div class="full"><label>Evidence file (employee work only)</label><input name="file" type="file" accept=".pdf,.ppt,.pptx,.doc,.docx,.xls,.xlsx,.csv,.zip,.png,.jpg,.jpeg" ${role==='employee'?'required':''}></div></div><div class="actions"><button>Create</button><a class="button secondary" href="work.html">Cancel</a></div><p id="m" class="message"></p></form>`;document.querySelector('#work-form').onsubmit=async e=>{e.preventDefault();const f=e.target,m=document.querySelector('#m');try{let r;if(role==='manager')r=await apiPost('/api/manager/work',{employee_id:f.employee_id.value,work_type:f.work_type.value,title:f.title.value,description:f.description.value,work_date:f.work_date.value,estimated_hours:f.hours_spent.value,priority:f.priority.value});else r=await apiPost('/api/work',{work_type:f.work_type.value,title:f.title.value,description:f.description.value,work_date:f.work_date.value,hours_spent:f.hours_spent.value});const wid=role==='manager'?r.work_id:r.work.id;if(role==='employee'){const file=f.file.files[0];if(!file)throw new Error('Evidence file is required');const data=await readFile(file);await apiPost(`/api/work/${wid}/files`,{file:{original_filename:file.name,mime_type:file.type,data}});await apiPost(`/api/work/${wid}/submit`,{});}m.textContent='Saved successfully.';m.className='message success';setTimeout(()=>location.href=`work.html?id=${wid}`,600)}catch(x){m.textContent=x.message;m.className='message error'}}}
function readFile(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
async function detail(){const r=await apiGet('/api/work/'+id);const w=r.work;document.querySelector('#title').textContent=w.title;document.querySelector('#add').style.display='none';content.innerHTML=`<div class="grid-2"><section class="card"><h3>Work details</h3><dl class="profile-grid"><dt>Reference</dt><dd>${escapeHTML(w.work_reference)}</dd><dt>Employee</dt><dd><a href="employee-detail.html?id=${w.employee_id}">${escapeHTML(w.employee_name)}</a></dd><dt>Type</dt><dd>${escapeHTML(w.work_type)}</dd><dt>Status</dt><dd>${status(w.status)}</dd><dt>Date</dt><dd>${escapeHTML(w.work_date)}</dd><dt>Hours</dt><dd>${w.hours_spent??'-'}</dd><dt>Credits</dt><dd>${money(w.credits_earned)}</dd><dt>Description</dt><dd>${escapeHTML(w.description)}</dd></dl></section><section class="card"><h3>Evidence</h3><div class="file-list">${r.files?.length?r.files.map(f=>`<div class="file-item"><span>${escapeHTML(f.original_filename)}<br><span class="small muted">${Math.round(f.file_size/1024)} KB</span></span><button class="secondary" data-file="${f.id}" data-name="${escapeHTML(f.original_filename)}">Download</button></div>`).join(''):'<div class="empty">No evidence uploaded.</div>'}</div></section></div><section class="section card"><h3>Review history</h3><div class="timeline">${r.reviews?.length?r.reviews.map(x=>`<div class="timeline-item"><strong>${escapeHTML(x.reviewer_role)}</strong> — ${status(x.decision)}<br>${escapeHTML(x.comments||'')}<br><span class="small muted">${escapeHTML(x.created_at)}</span></div>`).join(''):'<div class="muted">No reviews yet.</div>'}</div>${role==='employee'&&['approved','rejected','closed'].includes(w.status)?'<button id="ack" class="secondary">Acknowledge decision</button>':''}</section>`;document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>downloadFile(`/api/work/${id}/files/${b.dataset.file}/download`,b.dataset.name));
if(role==='employee'&&['draft','rejected'].includes(w.status)){const box=document.createElement('section');box.className='section card';box.innerHTML=`<h3>Submit evidence</h3><p class=\"muted\">Upload the actual work file, then submit it for manager review.</p><form id=\"evidence\"><input type=\"file\" name=\"file\" accept=\".pdf,.ppt,.pptx,.doc,.docx,.xls,.xlsx,.csv,.zip,.png,.jpg,.jpeg\" required><div class=\"actions\"><button>Upload and submit</button></div><p id=\"em\" class=\"message\"></p></form>`;content.appendChild(box);box.querySelector('#evidence').onsubmit=async e=>{e.preventDefault();const f=e.target,m=box.querySelector('#em'),file=f.file.files[0];try{const data=await readFile(file);await apiPost(`/api/work/${id}/files`,{file:{original_filename:file.name,mime_type:file.type,data}});await apiPost(`/api/work/${id}/submit`,{});m.textContent='Evidence uploaded and work submitted.';m.className='message success';setTimeout(()=>location.reload(),500)}catch(x){m.textContent=x.message;m.className='message error'}}}
const contrib=document.createElement('section');contrib.className='section card';const cr=await apiGet(`/api/work/${id}/contributors`).catch(()=>({contributors:[]}));contrib.innerHTML=`<h3>Contributors</h3>${cr.contributors?.length?cr.contributors.map(c=>`<div class=\"notice\"><strong>${escapeHTML(c.name||c.employee_id)}</strong><br>${escapeHTML(c.contribution)}</div>`).join(''):'<div class=\"muted\">No additional contributors recorded.</div>'}`;content.appendChild(contrib);
if(document.querySelector('#ack'))document.querySelector('#ack').onclick=async()=>{await apiPost(`/api/work/${id}/acknowledge`,{});document.querySelector('#ack').textContent='Acknowledged'};if(role==='manager'&&['submitted','under_review'].includes(w.status))review(w)}
async function review(w){const sec=document.createElement('section');sec.className='section card';sec.innerHTML=`<h3>Manager review</h3><form id="review"><div class="form-grid"><div><label>Decision</label><select name="decision"><option value="approved">Approve</option><option value="needs_revision">Request revision</option><option value="rejected">Reject</option></select></div><div><label>Credit rating (1–5)</label><input name="credit_rating" type="number" min="1" max="5" value="3"></div><div class="full"><label>Comments</label><textarea name="comments" required></textarea></div></div><button>Save review</button><p id="rm" class="message"></p></form>`;content.appendChild(sec);sec.querySelector('#review').onsubmit=async e=>{e.preventDefault();const f=e.target;try{await apiPost(`/api/manager/work/${w.id}/review`,{decision:f.decision.value,credit_rating:Number(f.credit_rating.value),comments:f.comments.value});location.reload()}catch(x){sec.querySelector('#rm').textContent=x.message}}}
if(newMode)create();else if(id)detail();else list();}
</script></body></html>
