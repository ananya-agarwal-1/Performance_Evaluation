<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notifications | EPMS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container">
  <div class="page-title"><div><h2>Notifications</h2><p class="muted">Decisions, reviews and appeal updates that involve you.</p></div></div>
  <div id="list"></div>
</main>
<script type="module">
import{apiGet,apiPatch,escapeHTML,requireRole}from'./js/common.js';
const u=await requireRole(['employee','manager','senior_authority','sm','performance_officer','board_member','admin']);
if(u){
  document.querySelector('[data-logout]').onclick=()=>{localStorage.clear();location.href='login.html'};
  const r=await apiGet('/api/notifications/my');
  document.querySelector('#list').innerHTML=r.notifications?.length
    ?r.notifications.map(n=>`<div class="note-card ${n.is_read?'':'unread'}"><h3>${escapeHTML(n.title||n.type||'Notification')}</h3><p>${escapeHTML(n.message||n.body||'')}</p><div class="small muted">${escapeHTML(n.created_at||'')}</div>${n.is_read?'':'<div class="actions" style="margin-top:12px"><button class="secondary" data-read="'+n.id+'">Mark as read</button></div>'}</div>`).join('')
    :'<div class="card empty">You have no notifications.</div>';
  document.querySelectorAll('[data-read]').forEach(b=>b.onclick=async()=>{
    try{await apiPatch('/api/notifications/'+b.dataset.read+'/read',{});b.textContent='Read';b.disabled=true;b.closest('.note-card').classList.remove('unread')}
    catch(e){alert(e.message)}
  });
}
</script>
</body>
</html>
