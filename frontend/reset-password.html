<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset password | EPMS</title>
<link rel="stylesheet" href="css/login.css">
</head>
<body class="login-bg">
<div class="login-box">
  <h1>Reset <span>Password</span></h1>
  <form id="f">
    <input id="email" name="email" type="email" placeholder="Email" required>
    <input id="token" name="token" placeholder="Reset code" required>
    <input id="password" name="password" type="password" placeholder="New password (8+ characters)" minlength="8" required>
    <button type="submit">Reset password</button>
    <p id="m" class="message" role="status"></p>
  </form>
  <p class="links"><a href="login.html">Back to login</a></p>
</div>
<script type="module">import{apiPost}from'./js/api.js';const f=document.querySelector('#f'),m=document.querySelector('#m');f.onsubmit=async e=>{e.preventDefault();try{const r=await apiPost('/api/auth/reset-password',{email:f.email.value,token:f.token.value,password:f.password.value});m.textContent=r.message;m.className='message success';setTimeout(()=>location.href='login.html',1000)}catch(x){m.className='message error';m.textContent=x.message}};</script>
</body>
</html>
